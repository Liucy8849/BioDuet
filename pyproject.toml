[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioduet-benchmark"
version = "0.1.0a1"
description = "Dual-control benchmark contracts and explicitly synthetic engineering examples"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
bioduet = "bioduet.cli:main"

[tool.setuptools]
py-modules = ["authorization_stage_recorder_v02", "host_evidence_journal_v04", "port_witness_v01", "scientific_episode_capture_v02", "scientific_world_observation_v03"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bioduet_eval = ["*.R", "*.json"]
